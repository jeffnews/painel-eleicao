<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração do 2º turno - Presidente</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#ffffff; --ink:#1f2328; --ink2:#59606a; --line:#d8dce1; --track:#e9ecef; --soft:#f5f6f8;
  --warn-bg:#fff4d6; --warn-ink:#6b4a00; --err-bg:#fde8e8; --err-ink:#8a1c1c;
  --c1:#1f7a8c; --c2:#d4772c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --ink:#ececec; --ink2:#a2a7ae; --line:#31353a; --track:#2a2d31; --soft:#1e2124;
    --warn-bg:#3a2f10; --warn-ink:#f3d98b; --err-bg:#3d1f1f; --err-ink:#f3b4b4;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums lining-nums;
}
main{max-width:1040px; margin:0 auto; padding:22px 20px 40px}
h1{font-size:24px; font-weight:600; margin:0; letter-spacing:-0.01em}
h2{font-size:17px; font-weight:600; margin:0 0 12px}
section{margin-top:36px}
.sub{color:var(--ink2); font-size:14px}
.topo{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap}
.chip{font-size:13px; padding:3px 10px; border-radius:6px; background:var(--soft); color:var(--ink2); border:1px solid var(--line)}
.chip.aviso{background:var(--warn-bg); color:var(--warn-ink); border-color:transparent}

.prog{margin-top:18px}
.prog-linha{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px; color:var(--ink2); margin-bottom:6px}
.prog-linha strong{color:var(--ink); font-weight:600}
.meter{height:6px; background:var(--track); border-radius:3px; overflow:hidden}
.meter > div{height:100%; background:var(--ink2)}

.duelo{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:28px; margin-top:26px}
.cand .nome{display:flex; align-items:center; gap:8px; font-size:18px; font-weight:600}
.cand .sw{width:12px; height:12px; border-radius:3px; flex:none}
.cand .meta{font-size:13px; color:var(--ink2); margin-top:1px}
.cand .pct{font-size:clamp(44px,8vw,64px); font-weight:600; line-height:1.05; letter-spacing:-0.03em; margin-top:6px}
.cand .votos{font-size:15px; color:var(--ink2)}
.cand .t1{margin-top:10px; font-size:13px; color:var(--ink2); border-top:1px solid var(--line); padding-top:8px}
.cand .t1 b{color:var(--ink); font-weight:600}
.eleito{display:inline-block; margin-left:6px; font-size:12px; font-weight:600; padding:1px 8px; border-radius:6px; background:var(--ink); color:var(--bg)}

.split{position:relative; margin-top:24px}
.split-bar{display:flex; gap:2px; height:20px; border-radius:4px; overflow:hidden; background:var(--track)}
.split-mid{position:absolute; left:50%; top:-5px; bottom:-5px; border-left:1.5px dashed var(--ink2); opacity:.7}
.dif{margin-top:12px; font-size:15px; text-align:center}
.dif small{display:block; color:var(--ink2); font-size:12px; margin-top:2px}

table{width:100%; border-collapse:collapse; font-size:14px}
th,td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600; color:var(--ink2); font-size:13px}
td small{display:block; color:var(--ink2); font-size:12px}
.pos{color:var(--ink)}
.rolavel{overflow-x:auto}
.vcard{background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:0 0 16px}
.vcard p{margin:0 0 6px}
.vcard p:last-child{margin-bottom:0}
th button{all:unset; cursor:pointer; font:inherit; color:inherit; font-weight:600}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--ink2); outline-offset:2px}
.dot{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:7px; vertical-align:-1px}

.mapa-grade{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; align-items:start}
@media (max-width:760px){ .mapa-grade{grid-template-columns:1fr} }
.mapbox{position:relative}
.mapbox svg{width:100%; height:auto; display:block}
.mapbox path{stroke:var(--bg); stroke-width:.9; stroke-linejoin:round}
.mapbox path:hover,.mapbox path:focus{stroke:var(--ink); stroke-width:1.6; outline:none}
.tip{position:absolute; pointer-events:none; z-index:5; background:var(--ink); color:var(--bg); font-size:13px; padding:7px 10px; border-radius:6px; line-height:1.35; white-space:nowrap; display:none}
.leg{display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--ink2); margin-top:10px}
.leg span{display:flex; align-items:center}
.reg{padding:12px 0; border-bottom:1px solid var(--line)}
.reg:first-child{padding-top:0}
.reg-topo{display:flex; justify-content:space-between; gap:10px; font-size:14px; margin-bottom:6px}
.reg-topo .nome{font-weight:600}
.reg-topo .ap{color:var(--ink2); font-size:12px}
.reg-bar{display:flex; gap:2px; height:10px; border-radius:3px; overflow:hidden; background:var(--track)}
.reg-nums{display:flex; justify-content:space-between; font-size:13px; color:var(--ink2); margin-top:4px}

footer{margin-top:40px; font-size:12px; color:var(--ink2); border-top:1px solid var(--line); padding-top:14px}
.msg{margin-top:18px; padding:14px 16px; border-radius:8px; background:var(--err-bg); color:var(--err-ink); font-size:14px}
.msg ul{margin:8px 0 0; padding-left:20px}
details.dbg{margin-top:20px; font-size:12px; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:10px 14px}
details.dbg pre{white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px}
:focus-visible{outline:2px solid var(--ink2); outline-offset:2px}
@media (max-width:520px){
  main{padding:18px 14px 32px}
  table{font-size:13px}
  th,td{padding:8px 5px}
  th{white-space:normal; font-size:12px; vertical-align:bottom}
  td{white-space:normal}
  td:first-child{white-space:normal}
  .dot{margin-right:5px}
}
@media (max-width:400px){
  table{font-size:12.5px}
  th,td{padding:8px 3px}
  .dot{margin-right:4px; width:9px; height:9px}
}
</style>
</head>

/* ============ leitura do formato do TSE ============ */
function normalizar(j){
  var carg=(j.carg||[])[0]||{}, cands=[];
  (carg.agr||[]).forEach(function(a){ (a.par||[]).forEach(function(p){ (p.cand||[]).forEach(function(c){
    cands.push({ n:String(c.n), nome:c.nmu||c.nm||('Candidato '+c.n), partido:p.sg, votos:num(c.vap), pct:num(c.pvap), seq:num(c.seq), eleito:c.e==='s' });
  }); }); });
  var s=j.s||{}, e=j.e||{}, v=j.v||{};
  var somaC=cands.reduce(function(t,c){return t+c.votos;},0);
  var secTot=num(s.ts), secOk=num(s.st);
  var out = {
    cands:cands,
    secoes:{ total:secTot, apuradas:secOk, pct: num(s.pst) || (secTot? secOk/secTot*100 : 0) },
    eleit:{ total:num(e.te), comp:num(e.c), abst:num(e.a), pabst:num(e.pa) },
    validos: num(v.vv) || num(v.vvc) || somaC,
    brancos: num(v.vb),
    nulos: num(v.tvn) || (num(v.vn)+num(v.van)),
    quando: quando(j.dg, j.hg),
    bruto:{ s:s, e:e, v:v }
  };
  return out;
}
function quando(dg, hg){
  var m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(dg||''); if(!m) return null;
  var d=new Date(m[3]+'-'+m[2]+'-'+m[1]+'T'+(hg||'00:00:00')+'-03:00');
  return isNaN(d)?null:d;
}
function fmtQuando(d){
  if(!d) return 'horário não informado';
  return d.toLocaleString('pt-BR',{timeZone:'America/Fortaleza',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',',' às');
}
function haQuanto(d){
  if(!d) return '';
  var min=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
  if(min<1) return 'agora há pouco';
  if(min<60) return 'há '+min+' min';
  var h=Math.floor(min/60); if(h<24) return 'há '+h+' h';
  return 'há '+Math.floor(h/24)+' d';
}

}

/* ============ cálculos ============ */
function finalistas(){
  var base=CFG.finalistas.map(function(f){return {n:f.n,nome:f.nome,cor:f.cor};});
  if(ST.br2){
    var achou=base.every(function(f){return ST.br2.cands.some(function(c){return c.n===f.n;});});
    if(!achou && ST.br2.cands.length>=2){
      var top=ST.br2.cands.slice().sort(function(a,b){return a.seq-b.seq;}).slice(0,2);
      base=top.map(function(c,i){return {n:c.n,nome:c.nome,cor:CFG.finalistas[i].cor};});
    }
  }
  return base;
}
function votosDe(norm,n){ var c=norm&&norm.cands.filter(function(x){return x.n===n;})[0]; return c?c.votos:0; }
function eleitoDe(norm,n){ var c=norm&&norm.cands.filter(function(x){return x.n===n;})[0]; return !!(c&&c.eleito); }
function pctDe(norm,n){
  if(!norm) return null;
  var c=norm.cands.filter(function(x){return x.n===n;})[0]; if(!c) return null;
  return norm.validos>0 ? c.votos/norm.validos*100 : c.pct;
}
function totalVotos(norm){ return norm? norm.validos+norm.brancos+norm.nulos : 0; }
function pctBranco(norm){ var t=totalVotos(norm); return t>0? norm.brancos/t*100 : null; }
function pctNulo(norm){ var t=totalVotos(norm); return t>0? norm.nulos/t*100 : null; }
function pctAbst(norm){
  if(!norm) return null;
  if(norm.eleit.pabst>0) return norm.eleit.pabst;
  var d=norm.eleit.comp+norm.eleit.abst; return d>0? norm.eleit.abst/d*100 : null;
}
function resumoUF(uf,f){
  var n=ST.uf[uf]; if(!n) return null;
  var a=votosDe(n,f[0].n), b=votosDe(n,f[1].n), v=n.validos;
  return { v1:a, v2:b, validos:v, p1:v>0?a/v*100:0, p2:v>0?b/v*100:0, apur:n.secoes.pct, secTot:n.secoes.total, secOk:n.secoes.apuradas };
}

function corDoEstado(r,f){

/* ============ o que falta para virar ============ */
function fmtCompacto(v){
  v=Math.round(v);
  if(v>=1e6) return (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if(v>=1e3) return Math.round(v/1e3).toLocaleString('pt-BR')+' mil';
  return String(v);
}
function pctTeto(v){ return v>100 ? '>100%' : fmtPct(v); }
function fmtFaixaPct(lo,hi){
  if(lo>100) return 'mais de 100%';
  if(Math.abs(hi-lo)<0.1) return pctTeto(lo);
  return (lo.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}))+' a '+pctTeto(hi);
}
function virar(a,b,falt,Rlo,Rhi,temBase){
  var r={a:a,b:b,m:Math.abs(a-b),l:a>b?0:(b>a?1:-1),falt:falt};
  if(a+b===0){ r.estado='sem'; return r; }
  if(falt<=0){ r.estado='fim'; return r; }
  if(!temBase){ r.estado='base'; return r; }
  r.Rlo=Rlo; r.Rhi=Rhi;
  r.pLo=(1+r.m/Rhi)/2*100;
  r.pHi=(1+r.m/Rlo)/2*100;
  r.estado = r.pLo>100 ? 'imp' : 'aberto';
  return r;
}
function restantesUF(uf){
  var n2=ST.uf[uf], n1=ST.uf1[uf]; if(!n2) return null;
  var falt=Math.max(0,n2.secoes.total-n2.secoes.apuradas);
  var temBase=!!(n1&&n1.secoes.total&&n1.validos);
  var media=temBase? n1.validos/n1.secoes.total : 0;
  return {falt:falt, temBase:temBase, lo:falt*media*CFG.fatorRestante[0], hi:falt*media*CFG.fatorRestante[1]};
}
function virarBrasil(f){
  var b2=ST.br2, b1=ST.br1;
  var a=votosDe(b2,f[0].n), b=votosDe(b2,f[1].n);
  var falt=Math.max(0,b2.secoes.total-b2.secoes.apuradas);
  var lo=0, hi=0, ok=0;
  UFS.forEach(function(uf){ var x=restantesUF(uf); if(x&&x.temBase){ lo+=x.lo; hi+=x.hi; ok++; } });
  var porEstado = ok===UFS.length, temBase=porEstado;
  if(!porEstado && b1 && b1.secoes.total && b1.validos){
    var media=b1.validos/b1.secoes.total; lo=falt*media*CFG.fatorRestante[0]; hi=falt*media*CFG.fatorRestante[1]; temBase=true;
  }
  var r=virar(a,b,falt,lo,hi,temBase); r.porEstado=porEstado; r.secFalt=falt; r.secTot=b2.secoes.total;
  return r;
}
function secVirar(f){

  var r=virarBrasil(f), card=el('div','vcard');
  var tr = r.l>=0 ? f[1-r.l] : null, ld = r.l>=0 ? f[r.l] : null;
  function linha(t){ card.appendChild(el('p',null,t)); }

  else if(r.estado==='base'){ linha('Ainda faltam os dados do 1º turno para estimar os votos restantes.'); }
  else {
    var pctFalt = r.secTot? r.secFalt/r.secTot*100 : 0;
    linha(ld ? (ld.nome+' lidera por '+fmtInt(r.m)+' votos válidos.') : 'Empate em votos válidos.');
    linha('Faltam '+fmtPct(pctFalt)+' das seções. Estimativa dos votos válidos que faltam: '+fmtCompacto(r.Rlo)+' a '+fmtCompacto(r.Rhi)+'.');
    if(tr){
      var soFar = (r.a+r.b)>0 ? (r.l===0? r.b : r.a)/(r.a+r.b)*100 : 0;
      if(r.estado==='imp') linha('Pelas estimativas, a virada é matematicamente impossível: '+tr.nome+' precisaria de mais de 100% dos votos restantes.');
      else linha(tr.nome+' precisaria de '+fmtFaixaPct(r.pLo,r.pHi)+' dos votos restantes para empatar. Entre os já apurados, tem '+fmtPct(soFar)+'.');

  var box=el('div','rolavel'), t=el('table'), th=el('thead'), trh=el('tr');
  ['Estado','Diferença (votos)','Faltam (est.)','Precisa de'].forEach(function(x){ trh.appendChild(el('th',null,x)); });
  th.appendChild(trh); t.appendChild(th);
  var tb=el('tbody');

    } else c1.textContent='-';

    else c2.textContent = q.estado==='fim' ? '0' : '-';
    if(q.estado==='aberto'){ if(q.l>=0) c3.appendChild(dotColor(f[1-q.l].cor)); c3.appendChild(document.createTextNode(fmtFaixaPct(q.pLo,q.pHi))); }
    else if(q.estado==='imp') c3.textContent='Impossível';

    else if(q.estado==='base') c3.textContent='Sem 1º turno';
    else c3.textContent='-';
    r2.appendChild(c1); r2.appendChild(c2); r2.appendChild(c3); tb.appendChild(r2);
  });
  t.appendChild(tb); box.appendChild(t); s.appendChild(box);
  s.appendChild(el('p','sub','A bolinha em "Precisa de" indica quem está atrás no estado. Estados em aberto aparecem primeiro, do mais próximo de virar ao mais distante.'));
  return s;
}

  document.documentElement.style.setProperty('--c2',f[1].cor);
  APP.appendChild(secTopo(f));
  APP.appendChild(secProgresso());
  APP.appendChild(secDuelo(f));
  APP.appendChild(secComparacao(f));
  APP.appendChild(secVirar(f));
  if(MAPA){ APP.appendChild(secMapa(f)); APP.appendChild(secTabela(f)); }
  APP.appendChild(secRodape());
  if(DEBUG) APP.appendChild(secDebug());
}

/* ============ ciclo de atualização ============ */
function cicloBR(){ return carregarBR2().catch(function(){}).then(function(){ if(ST.br1||!ST.br2) return; return carregarBR1().catch(function(){}); }).then(render); }
function cicloUF(){ return carregarUFs().then(render).then(carregarUF1).then(render); }
function iniciar(){
  cicloBR().then(cicloUF);
  setInterval(function(){ if(!document.hidden) cicloBR(); }, CFG.msBR);
  setInterval(function(){ if(!document.hidden) cicloUF(); }, CFG.msUF);
}
iniciar();
})();
</script>
